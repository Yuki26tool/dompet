name = "dompet-sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

# App statis (index.html, css, js, ikon) disajikan worker di rute non-/api/*
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dompet"
database_id = "d3c03863-6a34-42ea-a894-4c3adc88c5dc"

# Tidak ada secret global: kunci dibuat per ruang lewat POST /api/room
# dan disimpan sebagai hash SHA-256 di tabel `rooms`.
